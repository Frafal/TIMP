name: WebKit

# The app in WebKit, Safari's engine (tools/webkit.mjs): the layout checks Chrome does not
# catch, such as a page wider than an iPhone's screen. On Ubuntu, with WebKitGTK and its
# WebDriver: GitHub gives this repository no macOS runner. Not yet required for a deploy:
# it will be once it has proved steady.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-24.04   # webkit2gtk-driver is not in later Ubuntus
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: WebKitGTK, its WebDriver, a screen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends webkit2gtk-driver libwebkit2gtk-4.1-0 xvfb xauth
          find /usr/lib /usr/libexec -name MiniBrowser 2>/dev/null || true
      - name: The app in WebKit
        run: xvfb-run -a node tools/webkit.mjs
